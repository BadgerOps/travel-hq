<html lang="en">

         gesture zone. -->

    <meta name="theme-color" content="#161826" />
    <title>Travel HQ</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
