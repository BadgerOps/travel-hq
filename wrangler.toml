name = "travel-hq"
main = "src/server/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# The Vite build output. not_found_handling = "single-page-application" makes
# any unmatched path fall back to index.html so wouter client routes (e.g.
# /trips) resolve instead of 404ing -- but ONLY for browser navigations
# (requests with Sec-Fetch-Mode: navigate); verified empirically against the
# installed wrangler 4.113.0 with `wrangler dev` (see task-B-report.md).
# Non-navigation requests (fetch()/XHR, which is how the SPA calls /api) fall
# through to the Worker by default, matching the documented behaviour at
# https://developers.cloudflare.com/workers/static-assets/routing/single-page-application/.
# BUT a direct browser navigation to /api/* (e.g. pasting the URL) would also
# get the SPA shell instead of reaching the Worker -- confirmed by testing
# `curl -H "Sec-Fetch-Mode: navigate" /api/me` before adding the line below,
# which returned index.html, not JSON. run_worker_first pins /api/* (and
# /healthz) to the Worker regardless of navigation mode, per
# https://developers.cloudflare.com/workers/static-assets/routing/worker-script/.
[assets]
directory = "dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "travel-hq-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Workers AI JSON-mode fallback for inbound messages without calendar parts.
# Environment blocks do not inherit non-inheritable bindings, so repeat it.
[ai]
binding = "AI"

# Trip cover photos. Present in testing and production but missing here until
# now, which made `wrangler dev` -- the target vite proxies /api to -- the one
# place where c.env.TRIP_PHOTOS is undefined: GET /api/trips/:id/photo threw a
# TypeError and 500d, so every uploaded cover photo was a broken image locally.
# wrangler dev simulates the bucket on disk, so no real bucket is needed.
[[r2_buckets]]
binding = "TRIP_PHOTOS"
bucket_name = "travel-hq-dev-photos"

# The scheduled() handler in src/server/worker.ts: the push-notification sweep
# (#61) and the raw-email retention purge (#22, which asked for exactly this).
#
# EVERY FIVE MINUTES, NOT EVERY MINUTE. Cloudflare's minimum is one minute and
# this is deliberately not it. Five costs 288 invocations a day instead of
# 1,440, against a database that changes a handful of times an hour -- and buys
# nothing anybody can feel: reminder leads are measured in tens of minutes, so
# +-5 minutes on a 60-minute lead is well inside the noise of when someone
# actually looks at their phone. The sweep is written to make that trade safe:
# it queries a WINDOW rather than an instant (src/server/notifications/window.ts
# -- a 5-minute cron asking for what is due "now" would find nothing, forever,
# silently) and claims each notification before sending it, so the deliberately
# overlapping windows can never send anything twice.
[triggers]
crons = ["*/5 * * * *"]

# Web Push identity (VAPID, RFC 8292). The keypair identifies THIS SERVER to
# the push services; it does not authorize anything on a user's behalf.
#
# VAPID_PRIVATE_KEY IS NOT HERE, AND MUST NEVER BE. It is a secret, handled the
# way ENCRYPTION_KEY is:
#
#     npx wrangler secret put VAPID_PRIVATE_KEY --env production
#
# ...and for local development it goes in .dev.vars, which is gitignored.
# Generate a pair with `generateVapidKeys()` from src/server/push/vapid.ts
# (base64url, P-256); the PUBLIC half is also what the client passes to
# pushManager.subscribe(), so the two must be from the same pair or every
# subscription silently fails to decrypt.
#
# The public key below is empty until an operator fills it in. That is a
# supported state, not a broken one: resolveVapid() in
# src/server/notifications/sweep.ts refuses to run the sweep unless all three
# values are present, and logs `notification_sweep_unconfigured` once per tick.
# It deliberately does NOT take claims it cannot honour -- a claim is permanent,
# so claiming and failing would mean those reminders never re-arm.
[vars]
VAPID_PUBLIC_KEY = "BL2E3xYeNI4iAwA2ztRd63OiEMflBQ7iA1foWVMPgeejc-oFEbrmTGVyZQHNnZBES5KakFbPOCXFxNz25jh5k10"
VAPID_SUBJECT = "mailto:trips@badgerops.foo"

# --- testing (PR preview target; its own D1) --------------------------------
[env.testing]
[env.testing.assets]
directory = "dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

# No Cloudflare Access application exists for the testing Worker yet, so the
# auth vars are unset and every /api request on testing 500s (fail-closed --
# resolveVerifier refuses to run without them). Create a second Access app
# scoped to the testing Worker's hostname and put its AUD tag here.
# [env.testing.vars]
# CF_ACCESS_TEAM_DOMAIN = "https://badgerops.cloudflareaccess.com"
# CF_ACCESS_AUD = "<the testing Access app's AUD tag>"

# NO CRON ON TESTING, on purpose -- `crons = []` clears the inherited trigger
# rather than leaving it to be inherited by accident.
#
# testing is a PR preview target. A preview Worker with a cron would sweep its
# own database on its own schedule, and every deployed preview branch would do
# so simultaneously -- racing each other for the same claims and sending real
# pushes to real phones from whatever half-finished branch happened to deploy
# last. The claim ledger would make those sends correct-once, which is the
# problem: "correct" here means a traveller's phone rings from a preview build
# nobody meant to ship. Testing exists to be looked at, not to page people.
#
# The sweep is exercised in tests (tests/server/notifications/) and can be run
# by hand against a preview with:
#     npx wrangler dev --env testing --test-scheduled
#     curl "http://localhost:8787/__scheduled?cron=*/5+*+*+*+*"
[env.testing.triggers]
crons = []

[[env.testing.d1_databases]]
binding = "DB"
database_name = "travel-hq-testing"
database_id = "d3425ba3-8d2c-4a07-aa62-dd23c61128c3"
migrations_dir = "migrations"

[env.testing.ai]
binding = "AI"

[[env.testing.r2_buckets]]
binding = "TRIP_PHOTOS"
bucket_name = "travel-hq-testing-photos"

# --- production (deployed from master; its own D1) --------------------------
[env.production]

# Persist every Worker invocation and console log in Cloudflare Workers
# Observability. Full sampling is intentional while diagnosing email ingest;
# lower logs.head_sampling_rate later if production volume warrants it.
[env.production.observability]
enabled = true

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[env.production.assets]
directory = "dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "travel-hq-production"
database_id = "9035fd50-6e50-401c-8e46-8ddc66a5467c"
migrations_dir = "migrations"

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "TRIP_PHOTOS"
bucket_name = "travel-hq-production-photos"

# Cloudflare Access config for human auth. NOT secrets (the AUD tag is an
# identifier, not a credential), so they live here rather than in
# `wrangler secret put`. TEAM DOMAIN MUST INCLUDE THE https:// SCHEME --
# auth.ts uses it verbatim as both the JWKS fetch base URL and the JWT
# `issuer` claim, and Access mints tokens with the scheme included.
# The AUD is the "Application Audience (AUD) Tag" from the Access app
# (Zero Trust -> Access -> Applications -> travel-hq-production ->
# Additional settings -> AUD tag) -- 64 hex chars, NOT the application's
# UUID id from the dashboard URL.
#
# The VAPID pair is repeated here for the same reason the AI and D1 bindings
# are: an environment's `vars` REPLACES the top-level table wholesale rather
# than merging into it, so omitting these would leave production with the
# Access vars and no push identity at all.
[env.production.vars]
CF_ACCESS_TEAM_DOMAIN = "https://badgerops.cloudflareaccess.com"
CF_ACCESS_AUD = "8827163cf52568219746a23c957628c4fc3b284d5383b4a78d12abc71f38d8ce"
VAPID_PUBLIC_KEY = "BL2E3xYeNI4iAwA2ztRd63OiEMflBQ7iA1foWVMPgeejc-oFEbrmTGVyZQHNnZBES5KakFbPOCXFxNz25jh5k10"
VAPID_SUBJECT = "mailto:trips@badgerops.foo"

# Repeated per environment for the same reason: [triggers] does not inherit
# into a named environment. Without this block, `wrangler deploy --env
# production` would deploy the scheduled() handler and never call it.
# See the top-level [triggers] for why five minutes rather than one.
[env.production.triggers]
crons = ["*/5 * * * *"]
